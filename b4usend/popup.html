<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>b4usend</title>
  <style>
    body { width: 320px; margin: 0; padding: 16px; font: 14px Arial, sans-serif; background: #f5f5f5; color: #222; }
    h1 { margin: 0 0 12px; font-size: 19px; }
    .status, .results { background: #fff; border-radius: 6px; padding: 10px; margin-bottom: 12px; }
    .analyzer-ready { border-left: 4px solid #27ae60; }
    .analyzer-error { border-left: 4px solid #e74c3c; }
    textarea { width: 100%; min-height: 80px; box-sizing: border-box; resize: vertical; padding: 8px; }
    button { width: 100%; margin-top: 8px; padding: 9px; border: 0; border-radius: 5px; cursor: pointer; }
    .signal-row { display: flex; align-items: center; gap: 8px; margin: 7px 0; }
    .signal-row span { width: 90px; font-size: 12px; }
    .signal-fill { flex: 1; height: 8px; background: #ddd; border-radius: 4px; overflow: hidden; }
    .signal-fill div { height: 100%; background: #3498db; }
    .muted { color: #777; font-size: 12px; text-align: center; }
  </style>
</head>
<body>
  <h1>b4usend</h1>
  <div id="analyzerStatus" class="status">Loading analyzer...</div>
  <textarea id="testInput" placeholder="Type a message to analyze..."></textarea>
  <button id="testBtn" type="button">Analyze message</button>
  <div id="testResults" class="results"></div>
  <div class="muted">Local message analysis</div>
  <script src="src/analyzer.js"></script>
  <script src="src/popup.js"></script>
</body>
</html>
