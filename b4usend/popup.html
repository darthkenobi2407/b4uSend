
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>b4usend</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #0b0b0b;
      color: #e5e5e5;
      font-family: Arial, sans-serif;
      font-size: 14px;
      line-height: 1.6;
    }

    h1 {
      margin: 4px 0 5px;
      font-size: 23px;
      color: #fff;
    }

    p {
      color: #bdbdbd;
    }

    a {
      color: #8ab4ff;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .brand {
      color: #8ab4ff;
      font-weight: bold;
      font-size: 12px;
      letter-spacing: 1px;
    }

    .intro {
      margin: 0 0 15px;
      color: #929292;
      font-size: 12px;
    }

    .try-analyzer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 10px 0;
      margin: 12px 0;
      border-top: 1px solid #292929;
      border-bottom: 1px solid #292929;
      font-size: 12px;
    }

    .try-analyzer span {
      color: #bdbdbd;
    }

    .try-analyzer a {
      font-weight: bold;
    }

    .status,
    .results {
      background: #111;
      border: 1px solid #292929;
      border-radius: 6px;
      padding: 11px;
      margin-bottom: 12px;
      overflow-wrap: anywhere;
    }


    textarea {
      display: block;
      width: 100%;
      min-height: 90px;
      resize: vertical;
      padding: 10px;
      border: 1px solid #383838;
      border-radius: 5px;
      background: #151515;
      color: #eee;
      font: inherit;
      line-height: 1.5;
      outline: none;
    }

    textarea::placeholder {
      color: #777;
    }

    textarea:focus {
      border-color: #8ab4ff;
    }

    button {
      width: 100%;
      margin-top: 9px;
      padding: 10px;
      border: 1px solid #8ab4ff;
      border-radius: 5px;
      background: #8ab4ff;
      color: #0b0b0b;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    button:hover {
      background: #a6c7ff;
    }

    button:active {
      background: #79a8f5;
    }

    .results {
      margin-top: 12px;
      min-height: 35px;
      color: #ddd;
    }

    .signal-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 9px 0;
    }

    .signal-row span {
      width: 90px;
      flex-shrink: 0;
      font-size: 12px;
      color: #bdbdbd;
    }

    .signal-fill {
      flex: 1;
      height: 7px;
      background: #303030;
      border-radius: 4px;
      overflow: hidden;
    }

    .signal-fill div {
      height: 100%;
      background: #8ab4ff;
      border-radius: 4px;
    }

    .muted {
      color: #777;
      font-size: 11px;
      text-align: center;
      margin-top: 12px;
    }

    .muted a {
      color: #8ab4ff;
    }
  </style>
</head>

<body>
  <div class="brand">b4usend</div>

  <h1>Message analyzer</h1>

  <p class="intro">
    Check the signals behind a message before you send it.
  </p>

  <div class="try-analyzer">
    <span>Need the installation guide?</span>

    <a
      href="https://github.com/darthkenobi2407/b4uSend"
      target="_blank"
      rel="noopener noreferrer"
    >
      View on GitHub →
    </a>
  </div>

  
  <textarea
    id="testInput"
    placeholder="Type a message to analyze..."
  ></textarea>

  <button id="testBtn" type="button">
    Analyze message
  </button>

  <div id="testResults" class="results"></div>

  <div class="muted">
    Local message analysis
  </div>

  <script src="src/analyzer.js"></script>
  <script src="src/popup.js"></script>
</body>
</html>
```
